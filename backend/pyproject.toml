[project]
name = "mbt"
version = "0.1.0"
description = "Markets backtester & screener (NSE)"
requires-python = ">=3.11"
license = { text = "Proprietary. All rights reserved. See LICENSE." }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "httpx>=0.27",
  "yfinance>=0.2.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mbt"]

[project.scripts]
mbt = "mbt.cli:main"
